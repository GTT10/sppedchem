name: One-shot sparse zero-product fix

on:
  push:
    branches:
      - feature/plog-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/plog-support
          fetch-depth: 0

      - name: Make scalar multiplication symmetric at zero
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/SCsparse_definitions.f90")
          text = path.read_text()
          old = """      if (a == 0.e0_dp) then
         call deallocate(C)
      else
         ! Initialize matrix
         call allocate(B%nr, B%nc, B%n, C)

         ! Perform multiplication
         C%IA = B%IA
         C%JA (1:C%n) = B%JA(1:C%n)
         C%A  (1:C%n) = B%A (1:C%n) * a
      endif
"""
          new = """!     Preserve dimensions for B*a exactly as for a*B, including a=0.
!     Both overloads must return the same initialized sparse structure so
!     later sums with absent optional chemistry terms remain well-defined.
      call allocate(B%nr, B%nc, B%n, C)
      C%IA = B%IA
      C%JA (1:C%n) = B%JA(1:C%n)
      C%A  (1:C%n) = B%A (1:C%n) * a
"""
          if old not in text:
              if new in text:
                  print("already patched")
                  raise SystemExit(0)
              raise SystemExit("expected sparse_dot_double block not found")
          path.write_text(text.replace(old, new, 1))
          print("patched")
          PY

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SCsparse_definitions.f90
          git commit -m "fix sparse zero scalar-product symmetry"
          git push origin HEAD:feature/plog-support
