name: Apply zero-collider Troe fix

on:
  push:
    branches:
      - feature/plog-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/plog-support
          fetch-depth: 0

      - name: Apply numerically stable zero-collider limits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/SCmodule.f90"): [
                  (
          """         Pr2 = Pr(iTROEitbFALL)

!        ** Computing troe centering factor
         log10Pr    = log10(Pr2/(one-Pr2))
""",
          """         Pr2 = max(Pr(iTROEitbFALL), sqrt(tiny(one)))

!        ** Computing troe centering factor
!        Species-specific collider channels can have M=0 and therefore
!        Pr=0.  Evaluate the Pr->0 limit without forming log10(0) and
!        the subsequent Inf/Inf ratio in the Troe broadening function.
         log10Pr = log10(Pr2) - log10(max(one-Pr2, tiny(one)))
""",
                  ),
              ],
              Path("src/SCconV.f90"): [
                  (
          """        Pr2 = Pr(iTROEiTBFALL)

!       ** Computing troe centering factor
         log10Pr    = log10(Pr2/(one-Pr2))
""",
          """        Pr2 = max(Pr(iTROEiTBFALL), sqrt(tiny(one)))

!       ** Computing troe centering factor
!       Species-specific collider channels can have M=0 and therefore
!       Pr=0.  Evaluate the Pr->0 limit without forming log10(0) and
!       the subsequent Inf/Inf ratio in the Troe broadening function.
         log10Pr = log10(Pr2) - log10(max(one-Pr2, tiny(one)))
""",
                  ),
                  (
          """      if (ntbFALL > 0) then
         kf(itbFALL) = kf(itbFALL) * FTL
!        Reciprocal of pressure-dependent reaction factor
         uFTL = one/FTL
      endif
""",
          """      if (ntbFALL > 0) then
!        A zero collider concentration is a valid state.  A working-
!        precision floor is chemically negligible but keeps the algebraic
!        recovery q/FTL and all analytic derivatives finite.
         FTL = max(FTL, sqrt(tiny(one)))
         kf(itbFALL) = kf(itbFALL) * FTL
!        Reciprocal of pressure-dependent reaction factor
         uFTL = one/FTL
      endif
""",
                  ),
                  (
          """         Pr_dlogFT_dlodPr_uMi              = one
         Pr_dlogFT_dlodPr_uMi(iTROEitbALL) = Pr_dlogFT_dlodPr_uMi(iTROEitbALL) &
                                           * Pr2 * dlogFtroe_dlogPr /M(iTROEitbALL)
""",
          """         Pr_dlogFT_dlodPr_uMi = one
!        Use the exact zero-safe identity
!          Pr/M = k0/(kinf+k0*M)
!        instead of Pr/M, which is the indeterminate 0/0 when a
!        species-specific collider is absent.
         Pr_dlogFT_dlodPr_uMi(iTROEitbALL) = dlogFtroe_dlogPr *       &
              k0(iTROEitbFALL) * ukinfpmk0(iTROEitbFALL)
""",
                  ),
              ],
          }

          changed = False
          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
                  elif new not in text:
                      raise SystemExit(f"expected patch context not found in {path}")
              path.write_text(text)

          print("patched" if changed else "already patched")
          PY

      - name: Commit patch to feature branch
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SCmodule.f90 src/SCconV.f90
          git commit -m "fix zero-collider Troe limits [troe-fix-applied]"
          git push origin HEAD:feature/plog-support
