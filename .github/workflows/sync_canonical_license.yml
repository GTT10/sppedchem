name: Sync canonical GPL text

on:
  push:
    branches:
      - docs/project-metadata
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/project-metadata
          fetch-depth: 0

      - name: Download and verify canonical SPDX license text
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-or-later.txt \
            -o LICENSE
          test "$(git hash-object LICENSE)" = "f6cdd22a6c1fbc887e08a215cb4beb3c47048041"

      - name: Commit canonical license text
        run: |
          if git diff --quiet -- LICENSE; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "legal: sync canonical GPL-3.0-or-later text"
          git push origin HEAD:docs/project-metadata
