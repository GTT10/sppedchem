name: Apply zero-collider Troe fix from PR

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/plog-support
          fetch-depth: 0

      - name: Patch zero-collider Troe limits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              "src/SCmodule.f90": [(
                  "         Pr2 = Pr(iTROEitbFALL)\n\n"
                  "!        ** Computing troe centering factor\n"
                  "         log10Pr    = log10(Pr2/(one-Pr2))\n",
                  "         Pr2 = max(Pr(iTROEitbFALL), sqrt(tiny(one)))\n\n"
                  "!        ** Computing troe centering factor\n"
                  "!        Species-specific collider channels can have M=0 and therefore\n"
                  "!        Pr=0. Evaluate the Pr->0 limit without log10(0) or Inf/Inf.\n"
                  "         log10Pr = log10(Pr2) - log10(max(one-Pr2, tiny(one)))\n",
              )],
              "src/SCconV.f90": [
                  (
                      "        Pr2 = Pr(iTROEiTBFALL)\n\n"
                      "!       ** Computing troe centering factor\n"
                      "         log10Pr    = log10(Pr2/(one-Pr2))\n",
                      "        Pr2 = max(Pr(iTROEiTBFALL), sqrt(tiny(one)))\n\n"
                      "!       ** Computing troe centering factor\n"
                      "!       Species-specific collider channels can have M=0 and therefore\n"
                      "!       Pr=0. Evaluate the Pr->0 limit without log10(0) or Inf/Inf.\n"
                      "         log10Pr = log10(Pr2) - log10(max(one-Pr2, tiny(one)))\n",
                  ),
                  (
                      "      if (ntbFALL > 0) then\n"
                      "         kf(itbFALL) = kf(itbFALL) * FTL\n"
                      "!        Reciprocal of pressure-dependent reaction factor\n"
                      "         uFTL = one/FTL\n"
                      "      endif\n",
                      "      if (ntbFALL > 0) then\n"
                      "!        A zero collider is valid. This working-precision floor is\n"
                      "!        chemically negligible and keeps q/FTL derivatives finite.\n"
                      "         FTL = max(FTL, sqrt(tiny(one)))\n"
                      "         kf(itbFALL) = kf(itbFALL) * FTL\n"
                      "!        Reciprocal of pressure-dependent reaction factor\n"
                      "         uFTL = one/FTL\n"
                      "      endif\n",
                  ),
                  (
                      "         Pr_dlogFT_dlodPr_uMi              = one\n"
                      "         Pr_dlogFT_dlodPr_uMi(iTROEitbALL) = Pr_dlogFT_dlodPr_uMi(iTROEitbALL) &\n"
                      "                                           * Pr2 * dlogFtroe_dlogPr /M(iTROEitbALL)\n",
                      "         Pr_dlogFT_dlodPr_uMi = one\n"
                      "!        Exact zero-safe identity: Pr/M = k0/(kinf+k0*M).\n"
                      "         Pr_dlogFT_dlodPr_uMi(iTROEitbALL) = dlogFtroe_dlogPr *       &\n"
                      "              k0(iTROEitbFALL) * ukinfpmk0(iTROEitbFALL)\n",
                  ),
              ],
          }

          changed = False
          for filename, replacements in edits.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
                  elif new not in text:
                      raise SystemExit(f"patch context missing: {filename}")
              path.write_text(text)
          print("patched" if changed else "already patched")
          PY

      - name: Commit and push
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SCmodule.f90 src/SCconV.f90
          git commit -m "fix zero-collider Troe limits [troe-fix-applied]"
          git push origin HEAD:feature/plog-support
