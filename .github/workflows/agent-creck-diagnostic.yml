name: Apply CRECK capacity fix

on:
  push:
    branches:
      - agent/creck-capacity-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creck-capacity-fix

      - name: Patch parser and regression harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import traceback

          try:
              source_path = Path('src/chemkin_module.f90')
              source = source_path.read_text()

              if 'Remove any stale link before interpreting a new mechanism' not in source:
                  needle = "      CALL plog_reset\n      WRITE  (LOUT, 15) VERS(:4)\n"
                  insert = """      CALL plog_reset
!     Remove any stale link before interpreting a new mechanism. A failed
!     parse must not leave an older cklink that can be mistaken for current
!     output by an embedding application.
      OPEN (LINC, FORM='UNFORMATTED', STATUS='REPLACE',&
                  FILE=trim(mechdir)//"cklink")
      CLOSE (LINC, STATUS='DELETE')
      WRITE  (LOUT, 15) VERS(:4)
"""
                  if needle not in source:
                      raise RuntimeError('plog_reset insertion point not found')
                  source = source.replace(needle, insert, 1)

              if 'Continuing with II pinned at IDIM' not in source:
                  pattern = re.compile(
                      r"(?m)^            ELSE\n"
                      r"               WRITE \(LOUT, 1070\)\n"
                      r"               KERR = \.TRUE\.\n"
                      r"            ENDIF$"
                  )
                  replacement = """            ELSE
!              Fail immediately. Continuing with II pinned at IDIM makes
!              auxiliary records from later reactions attach to reaction
!              IDIM and can replace this primary error with a false PLOG
!              ordering diagnostic.
               WRITE (*,1070) IDIM
               WRITE (LOUT,1070) IDIM
               CLOSE (LIN)
               CLOSE (LOUT)
               ERROR STOP 1
            ENDIF"""
                  source, count = pattern.subn(replacement, source, count=1)
                  if count != 1:
                      raise RuntimeError(f'reaction overflow block matches: {count}')

              if 'Preserve the primary parser diagnostic' not in source:
                  search_from = source.index(' 5000 CONTINUE')
                  start = source.index('      CLOSE (LIN)\n', search_from)
                  end = source.index('      DO 1150 K = 1, KK\n', start)
                  replacement = """      CLOSE (LIN)
!
!     Preserve the primary parser diagnostic. Do not run PLOG validation
!     and do not create a linking file when an earlier parse check failed.
      IF (KERR) THEN
         WRITE (LOUT, '(//A)')&
         ' ERROR...MECHANISM PARSING FAILED; NO LINKING FILE WAS WRITTEN'
         CLOSE (LOUT)
         ERROR STOP 1
      ENDIF
!
!     Validate and pack PLOG data before opening cklink. plog_finalize uses
!     ERROR STOP for malformed data, so no partial link exists on failure.
      CALL plog_finalize(KERR, LOUT)
      IF (KERR) THEN
         WRITE (LOUT, '(//A)')&
         ' ERROR...PLOG VALIDATION FAILED; NO LINKING FILE WAS WRITTEN'
         CLOSE (LOUT)
         ERROR STOP 1
      ENDIF
!
!     Create the link only after all parse-time validation succeeds.
      OPEN (LINC, FORM='UNFORMATTED', STATUS='REPLACE',&
                  FILE=trim(mechdir)//"cklink")
      REWIND LINC
!     v2 leading record: magic + integer schema version. Positively
!     identifies the format for the reader (SCcklink) — supersedes the
!     fragile VERS-string check.
      WRITE (LINC) CK_MAGIC, CK_SCHEMA
      WRITE (LINC) VERS, PREC, KERR

!
"""
                  source = source[:start] + replacement + source[end:]

              if 'reaction count exceeds CKINTP capacity IDIM=' not in source:
                  pattern = re.compile(
                      r"(?m)^ 1070 FORMAT \(6X,'Error\.\.\.more than IDIM reactions\.\.\.'\)$"
                  )
                  replacement = (
                      " 1070 FORMAT (6X,'ERROR...reaction count exceeds CKINTP capacity IDIM=',&\n"
                      "                   I0,'. Aborting before auxiliary/PLOG parsing.')"
                  )
                  source, count = pattern.subn(replacement, source, count=1)
                  if count != 1:
                      raise RuntimeError(f'format 1070 matches: {count}')

              source_path.write_text(source)

              test_path = Path('scripts/run_neg_tests.sh')
              tests = test_path.read_text()
              if 'generated reaction-count overflow' not in tests:
                  marker = '\ndone\n\necho "======================================================================"\n'
                  pos = tests.rfind(marker)
                  if pos < 0:
                      raise RuntimeError('negative-test tail marker not found')
                  block = r'''
done

# Generated boundary case: reaction 9001 must fail at the fixed IDIM=9000
# capacity before any following auxiliary/PLOG line can be associated with
# reaction 9000. Seed a stale cklink to verify fail-closed invalidation.
echo "  case: generated reaction-count overflow"
capacity_dir="$tmp_root/reaction_capacity"
mkdir -p "$capacity_dir"
cat > "$capacity_dir/chem.inp" <<'EOF'
ELEMENTS
H O
END
SPECIES
H2 H O OH
END
REACTIONS CAL/MOLE
EOF
for ((i=1; i<=9001; i++)); do
  printf '%s\n' 'H2+O=H+OH  1.000E+13  0.0  0.0' >> "$capacity_dir/chem.inp"
done
printf '%s\n' 'END' >> "$capacity_dir/chem.inp"
cp "$root_dir/test/data_plog/therm.dat" "$capacity_dir/therm.dat"
printf '%s\n' 'stale-link-sentinel' > "$capacity_dir/cklink"

set +e
out=$(SC_MECHDIR="$capacity_dir/" "$DRV_BIN" 2>&1)
rc=$?
set -e

ok=1
want="reaction count exceeds CKINTP capacity IDIM=9000"
if [[ $rc -eq 0 ]]; then
  echo "    FAIL: driver exited 0 after exceeding IDIM"
  ok=0
fi
if ! grep -qF "$want" <<<"$out"; then
  echo "    FAIL: primary reaction-capacity diagnostic not found"
  ok=0
fi
if grep -qF "PLOG pressures for reaction" <<<"$out"; then
  echo "    FAIL: secondary PLOG-order diagnostic masked the capacity error"
  ok=0
fi
if [[ -e "$capacity_dir/cklink" ]]; then
  echo "    FAIL: cklink exists after failed parse"
  ok=0
fi

if [[ $ok -eq 1 ]]; then
  echo "    PASS: overflow refused before PLOG parsing; no cklink remains"
else
  echo "    --- driver output ---"
  sed 's/^/    | /' <<<"$out"
  fails=$((fails+1))
fi
'''
                  tests = tests[:pos + 1] + block + tests[pos + len('\ndone\n'):]
                  test_path.write_text(tests)

              Path('agent-fix-error.txt').unlink(missing_ok=True)
              for path in (
                  Path('agent-diagnostic.txt'),
                  Path('agent-targets.txt'),
                  Path('.github/workflows/agent-creck-diagnostic.yml'),
              ):
                  path.unlink(missing_ok=True)
          except Exception:
              Path('agent-fix-error.txt').write_text(traceback.format_exc())
          PY

          git diff --check || true

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git commit -m "Fail closed on CKINTP reaction-capacity overflow"
          git push
