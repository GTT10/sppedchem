name: SpeedCHEM CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speedchem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel-ifx:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I_MPI_FABRICS: shm
      OMP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply and publish zero-collider Troe fix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/plog-support'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              "src/SCmodule.f90": [(
                  "         Pr2 = Pr(iTROEitbFALL)\n\n"
                  "!        ** Computing troe centering factor\n"
                  "         log10Pr    = log10(Pr2/(one-Pr2))\n",
                  "         Pr2 = max(Pr(iTROEitbFALL), sqrt(tiny(one)))\n\n"
                  "!        ** Computing troe centering factor\n"
                  "!        Species-specific collider channels can have M=0 and therefore\n"
                  "!        Pr=0. Evaluate the Pr->0 limit without log10(0) or Inf/Inf.\n"
                  "         log10Pr = log10(Pr2) - log10(max(one-Pr2, tiny(one)))\n",
              )],
              "src/SCconV.f90": [
                  (
                      "        Pr2 = Pr(iTROEiTBFALL)\n\n"
                      "!       ** Computing troe centering factor\n"
                      "         log10Pr    = log10(Pr2/(one-Pr2))\n",
                      "        Pr2 = max(Pr(iTROEiTBFALL), sqrt(tiny(one)))\n\n"
                      "!       ** Computing troe centering factor\n"
                      "!       Species-specific collider channels can have M=0 and therefore\n"
                      "!       Pr=0. Evaluate the Pr->0 limit without log10(0) or Inf/Inf.\n"
                      "         log10Pr = log10(Pr2) - log10(max(one-Pr2, tiny(one)))\n",
                  ),
                  (
                      "      if (ntbFALL > 0) then\n"
                      "         kf(itbFALL) = kf(itbFALL) * FTL\n"
                      "!        Reciprocal of pressure-dependent reaction factor\n"
                      "         uFTL = one/FTL\n"
                      "      endif\n",
                      "      if (ntbFALL > 0) then\n"
                      "!        A zero collider is valid. This working-precision floor is\n"
                      "!        chemically negligible and keeps q/FTL derivatives finite.\n"
                      "         FTL = max(FTL, sqrt(tiny(one)))\n"
                      "         kf(itbFALL) = kf(itbFALL) * FTL\n"
                      "!        Reciprocal of pressure-dependent reaction factor\n"
                      "         uFTL = one/FTL\n"
                      "      endif\n",
                  ),
                  (
                      "         Pr_dlogFT_dlodPr_uMi              = one\n"
                      "         Pr_dlogFT_dlodPr_uMi(iTROEitbALL) = Pr_dlogFT_dlodPr_uMi(iTROEitbALL) &\n"
                      "                                           * Pr2 * dlogFtroe_dlogPr /M(iTROEitbALL)\n",
                      "         Pr_dlogFT_dlodPr_uMi = one\n"
                      "!        Exact zero-safe identity: Pr/M = k0/(kinf+k0*M).\n"
                      "         Pr_dlogFT_dlodPr_uMi(iTROEitbALL) = dlogFtroe_dlogPr *       &\n"
                      "              k0(iTROEitbFALL) * ukinfpmk0(iTROEitbFALL)\n",
                  ),
              ],
          }

          changed = False
          for filename, replacements in edits.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
                  elif new not in text:
                      raise SystemExit(f"patch context missing: {filename}")
              path.write_text(text)
          print("patched" if changed else "already patched")
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SCmodule.f90 src/SCconV.f90
          git commit -m "fix zero-collider Troe limits [troe-fix-applied]"
          git push origin HEAD:feature/plog-support

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Cantera reference implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cantera==3.2.0"
          python - <<'PY'
          import cantera as ct
          print("Cantera", ct.__version__)
          PY

      - name: Configure Intel oneAPI APT repository
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg-agent wget
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update

      - name: Install Intel Fortran compiler and MPI
        run: |
          sudo apt-get install -y \
            intel-oneapi-compiler-fortran \
            intel-oneapi-mpi-devel

      - name: Report toolchain
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          mpiifx --version
          mpiexec --version
          python --version
          ck2yaml --help >/dev/null

      - name: Run bundled regression suite
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          make clean
          make test-all

      - name: Run pinned public C3Mech PLOG validation
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          PLOG_CANTERA_PYTHON="$(command -v python)" \
          PLOG_CK2YAML="$(command -v ck2yaml)" \
          make test-real-plog

      - name: Verify tracked files remain clean
        run: git diff --exit-code
