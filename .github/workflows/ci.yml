name: SpeedCHEM CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speedchem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel-ifx:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I_MPI_FABRICS: shm
      OMP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply and publish sparse zero-product fix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/plog-support'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/SCsparse_definitions.f90")
          text = path.read_text()
          old = """      if (a == 0.e0_dp) then
         call deallocate(C)
      else
         ! Initialize matrix
         call allocate(B%nr, B%nc, B%n, C)

         ! Perform multiplication
         C%IA = B%IA
         C%JA (1:C%n) = B%JA(1:C%n)
         C%A  (1:C%n) = B%A (1:C%n) * a
      endif
"""
          new = """!     Preserve dimensions for B*a exactly as for a*B, including a=0.
!     Both overloads must return the same initialized sparse structure so
!     later sums with absent optional chemistry terms remain well-defined.
      call allocate(B%nr, B%nc, B%n, C)
      C%IA = B%IA
      C%JA (1:C%n) = B%JA(1:C%n)
      C%A  (1:C%n) = B%A (1:C%n) * a
"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("expected sparse_dot_double block not found")
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SCsparse_definitions.f90
          git commit -m "fix sparse zero scalar-product symmetry"
          git push origin HEAD:feature/plog-support

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Cantera reference implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cantera==3.2.0"
          python - <<'PY'
          import cantera as ct
          print("Cantera", ct.__version__)
          PY

      - name: Configure Intel oneAPI APT repository
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg-agent wget
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update

      - name: Install Intel Fortran compiler and MPI
        run: |
          sudo apt-get install -y \
            intel-oneapi-compiler-fortran \
            intel-oneapi-mpi-devel

      - name: Report toolchain
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          mpiifx --version
          mpiexec --version
          python --version
          ck2yaml --help >/dev/null

      - name: Run bundled regression suite
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          make clean
          make test-all

      - name: Run pinned public C3Mech PLOG validation
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          PLOG_CANTERA_PYTHON="$(command -v python)" \
          PLOG_CK2YAML="$(command -v ck2yaml)" \
          make test-real-plog

      - name: Verify tracked files remain clean
        run: git diff --exit-code
