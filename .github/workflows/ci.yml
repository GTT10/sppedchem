name: SpeedCHEM CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speedchem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-creck-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/creck-capacity-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply fail-closed CKINTP patch
        run: python3 scripts/agent_apply_creck_fix.py

      - name: Commit source change when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/chemkin_module.f90; then
            echo "Source already patched"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/chemkin_module.f90
          git commit -m "Fail closed on CKINTP reaction-capacity overflow"
          git push origin "HEAD:${{ github.head_ref }}"

  intel-ifx:
    needs: apply-creck-fix
    if: always() && (needs.apply-creck-fix.result == 'success' || needs.apply-creck-fix.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I_MPI_FABRICS: shm
      OMP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Cantera reference implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cantera==3.2.0"
          python - <<'PY'
          import cantera as ct
          print("Cantera", ct.__version__)
          PY

      - name: Configure Intel oneAPI APT repository
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg-agent wget
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update

      - name: Install Intel Fortran compiler and MPI
        run: |
          sudo apt-get install -y \
            intel-oneapi-compiler-fortran \
            intel-oneapi-mpi-devel

      - name: Report toolchain
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          mpiifx --version
          mpiexec --version
          python --version
          ck2yaml --help >/dev/null

      - name: Run bundled regression suite
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          make clean
          make test-all

      - name: Run pinned public C3Mech PLOG validation
        run: |
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1
          PLOG_CANTERA_PYTHON="$(command -v python)" \
          PLOG_CK2YAML="$(command -v ck2yaml)" \
          make test-real-plog

      - name: Verify tracked files remain clean
        run: git diff --exit-code
