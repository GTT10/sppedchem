name = "speedchem"
version = "0.1.0"
license = "GPL-3.0-or-later"
author = "Federico Perini and SpeedCHEM contributors"
maintainer = "pqg693x1@s.okayama-u.ac.jp"
copyright = "Copyright (C) 2010-2013 Federico Perini and later contributors"
description = "Sparse analytical-Jacobian Fortran library for gas-phase chemical kinetics"
homepage = "https://github.com/GTT10/sppedchem"
categories = ["scientific", "simulation"]
keywords = ["chemical-kinetics", "combustion", "sparse-jacobian", "plog"]

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[install]
library = true

[library]
source-dir = "src"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
